name: Publish to Typst Universe

# 触发条件:推送 v* 标签 或 手动触发
# Trigger: push v* tag or manual dispatch
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号(如 0.3.1,不带 v 前缀)"
        required: true
        default: "0.3.1"

env:
  # 注册表所在的托管平台
  # for Universe this is Github: https://github.com
  REGISTRY_FORGE: https://github.com
  # 承载已发布包的仓库(ups食),PR 以其最新 main 为基底
  # 需要 REGISTRY_TOKEN 可读(typst/packages 公开,读即可)
  REGISTRY_REPO: typst/packages
  # 要推送发布版本的目标仓库,必须是你有写权限的 fork
  # 需要 REGISTRY_TOKEN 可 push(即 secrets.TYPST_PACKAGES_TOKEN)
  REGISTRY_FORK: kych-net/packages
  # 包在仓库里的路径前缀(Universe 为 packages/preview)
  PATH_PREFIX: packages/preview

permissions:
  contents: read

jobs:
  submit-pr:
    name: 提交 PR 到 typst/packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 模板
        uses: actions/checkout@v5

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # 从 tag 名去掉前导 v
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "解析到的版本号: ${{ steps.ver.outputs.version }}"

      - name: 校验 typst.toml 版本号一致
        shell: bash
        run: |
          EXPECTED="${{ steps.ver.outputs.version }}"
          ACTUAL=$(grep -E '^version' typst.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          echo "typst.toml version = $ACTUAL, 期望 = $EXPECTED"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::typst.toml 中的版本号($ACTUAL)与触发版本($EXPECTED)不一致,请先更新 typst.toml"
            exit 1
          fi

      # 关键:用 actions/checkout + token 克隆 registry 仓库。checkout 会把 token
      # 写入该目录的 git 凭据(http.extraheader),后续 push 到同一 host 的 fork 自动带 token,
      # 无需 URL 内嵌 —— 这正是官方模板规避 403 的方式。
      - name: Checkout package registry (typst/packages)
        # 完整 checkout 上游 registry,保证目标目录可被 git add 提交。
        # 不使用 sparse-checkout:新包的 <name>/<version> 目录在 registry 中尚不存在,
        # 稀疏(cone)模式会忽略新文件导致"nothing to commit"。
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REGISTRY_REPO }}
          token: ${{ secrets.TYPST_PACKAGES_TOKEN }}
          path: package-registry

      - name: 放置包文件
        shell: bash
        run: |
          DEST="package-registry/${PATH_PREFIX}/underhell/${{ steps.ver.outputs.version }}"
          # 目录若尚未检出则预先创建(相对 package-registry 目录)
          mkdir -p "$DEST"
          # 复制包根文件:typst.toml / lib.typ / README.md / LICENSE
          cp typst.toml lib.typ README.md LICENSE "$DEST/"
          # 复制资源目录:img(背景图等)、languages(语言配置)、example(示例)
          cp -r img languages example "$DEST/"
          # 删除可能的 .gitignore / 构建产物,包内不需要
          rm -f "$DEST/.gitignore" 2>/dev/null || true
          echo "=== 包内容 ==="
          ls -la "$DEST"

      - name: 提交并推送到 fork
        env:
          # 用户名为 fork 所有者(kych-net)+ token 作为密码,消除 fine-grained PAT 身份解析歧义
          GH_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
        shell: bash
        run: |
          cd package-registry
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 以最新上游 main 为基底,避免 fork 落后导致 PR 冲突
          BRANCH="add-underhell-${{ steps.ver.outputs.version }}"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "Add underhell@${{ steps.ver.outputs.version }}" || echo "无变更可提交(可能已存在)"
          # 与 typst 官方模板一致:trust actions/checkout 注入的凭据,直接 push fork
          git remote add fork "${REGISTRY_FORGE}/${REGISTRY_FORK}"
          git push --force --set-upstream fork "$BRANCH"

      - name: 创建 PR 到 typst/packages
        env:
          GH_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
        shell: bash
        run: |
          # 若已存在同分支的 PR 则跳过创建
          EXISTING=$(gh pr view \
            --repo typst/packages \
            --head ${REGISTRY_FORK%/*}:add-underhell-${{ steps.ver.outputs.version }} \
            --json number --jq '.number' 2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            echo "已存在 PR #$EXISTING,跳过创建"
            exit 0
          fi
          # 用仓库内的 pr-body.md 模板,替换版本号占位符
          cp "$GITHUB_WORKSPACE/.github/pr-body.md" /tmp/pr-body.md
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.ver.outputs.version }}/g" /tmp/pr-body.md
          echo "=== PR body ==="
          cat /tmp/pr-body.md
          gh pr create \
            --repo typst/packages \
            --base main \
            --head ${REGISTRY_FORK%/*}:add-underhell-${{ steps.ver.outputs.version }} \
            --title "Add underhell@${{ steps.ver.outputs.version }}" \
            --body-file /tmp/pr-body.md